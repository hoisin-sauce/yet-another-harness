$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "schemas:v0:agent"
title: Agent Schema
description: >
  Describes the format that agents should be specified in for usage in Yet-Another-Harness (YAH)

type: object

required:
  - id
  - version

properties:
  id:
    type: string

  version:
    $ref: "schemas:v0:version"

  models:
    ...

  systemPrompt:
    type: object
    properties:
      required:
        - promptText
      promptText:
        $ref: "schemas:v0:lib#/$defs/formattableString"
      promptTextFillin:
        type: object

  toolConfig:
    ...

  skillConfig:
    ...